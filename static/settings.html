<script src="shared/bp-art.js?v=6"></script>
<style>
  .set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--glass-border);}
  .set-row:last-child{border-bottom:none;}
  .set-row .t{font-size:13px;font-weight:700;color:var(--ink-0);}
  .set-row .d{font-size:11px;color:var(--ink-500);}
  .sw{width:38px;height:21px;border-radius:99px;background:var(--wash-3);position:relative;cursor:pointer;flex-shrink:0;}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s;}
  .sw.on{background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}
  .sw.on::after{left:19px;}
</style>
</head>
<body>
<div class="app">
  <div id="rail" data-active="settings"></div>
  <div class="main">
    <div class="topbar"><div class="brand">Pulse<span>IQ</span></div><div class="grow"></div><div class="clock" id="clock">--:--:--</div></div>
    <div class="content">
      <div class="page-head"><h1>Settings</h1><span class="sub">Preferences &amp; notifications</span></div>
      <div class="card" style="max-width:520px;">
        <div class="set-row"><div><div class="t">Push Notifications</div><div class="d">Medicine reminders &amp; alerts</div></div><div class="sw on"></div></div>
        <div class="set-row"><div><div class="t">Share data with care team</div><div class="d">Doctors linked to your account</div></div><div class="sw on"></div></div>
        <div class="set-row"><div><div class="t">Two-factor authentication</div><div class="d">Extra security on sign-in</div></div><div class="sw"></div></div>
      </div>
    </div>
    <div class="status-bar"><span>SYS: <b>OPERATIONAL</b></span><span>PulseIQ · Demo Mode</span></div>
  </div>
</div>
<script src="shared/shell.js?v=16"></script>
<script>
  document.querySelectorAll('.sw').forEach(function(sw){ sw.addEventListener('click', function(){ this.classList.toggle('on'); }); });
  function tick(){ var d=new Date(); document.getElementById('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }
  setInterval(tick,1000); tick();
</script>
</body>
</html>
