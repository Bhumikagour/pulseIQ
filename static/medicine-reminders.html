<style>
  .med-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}

  /* Interactive week strip — click any past/today date to view & edit it */
  .cal-bar{display:flex;align-items:center;gap:9px;margin-bottom:18px;}
  .cal-nav{background:var(--glass);border:1px solid var(--glass-border-2);color:var(--ink-300);
    width:34px;height:56px;border-radius:12px;font-size:14px;cursor:pointer;flex-shrink:0;}
  .cal-nav:hover:not(:disabled){color:var(--ink-0);border-color:rgba(34,229,240,0.4);}
  .cal-nav:disabled{opacity:.3;cursor:default;}
  .cal-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;flex:1;}
  .cal-day{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
    padding:9px 0;text-align:center;cursor:pointer;transition:all .12s;position:relative;}
  .cal-day:hover{border-color:rgba(34,229,240,0.45);}
  .cal-day .dw{font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-600);font-weight:800;}
  .cal-day .dn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;color:var(--ink-200);margin-top:2px;}
  .cal-day.on{background:rgba(34,229,240,0.12);border-color:rgba(34,229,240,0.55);}
  .cal-day.on .dn{color:var(--cyan-bright);}
  .cal-day.today .dw{color:var(--cyan-bright);}
  /* Future days are browsable now, so they read as "ahead" rather than
     disabled: dimmed, but clearly still a target. */
  .cal-day.future{opacity:.55;}
  .cal-day.future.on{opacity:1;}
  .cal-day .pip{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px;}
  .cal-day .pip i{width:4px;height:4px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);}
  .cal-day .pip i.miss{background:var(--ink-600);box-shadow:none;}
  .day-title{display:flex;align-items:baseline;gap:9px;}
  .day-title .badge-day{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:99px;
    background:rgba(34,229,240,0.12);color:var(--cyan-bright);}

  .med-item{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:15px 17px;margin-bottom:11px;position:relative;}
  .med-item .row1{display:flex;align-items:baseline;gap:9px;}
  .med-item .nm{font-size:14px;font-weight:800;color:var(--ink-0);}
  .med-item .ds{font-size:11.5px;color:var(--cyan-bright);font-weight:700;}
  .med-item .nt{font-size:11px;color:var(--ink-500);margin-top:3px;}
  .med-del{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--ink-600);
    font-size:15px;cursor:pointer;padding:2px 6px;border-radius:6px;opacity:0;transition:opacity .12s;}
  .med-item:hover .med-del{opacity:1;}
  .med-del:hover{background:rgba(255,92,114,0.16);color:var(--red);}

  .slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;}
  .slot{display:flex;align-items:center;gap:7px;background:var(--wash-1);border:1px solid var(--glass-border-2);
    border-radius:10px;padding:7px 12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;
    font-weight:700;color:var(--ink-300);}
  .slot:hover{border-color:rgba(34,229,240,0.4);}
  .slot .tickbox{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--ink-600);display:flex;
    align-items:center;justify-content:center;font-size:10px;color:transparent;}
  .slot.done{background:rgba(60,230,133,0.1);border-color:rgba(60,230,133,0.4);color:var(--green);}
  .slot.done .tickbox{background:var(--green);border-color:var(--green);color:var(--screen);}
  /* Chrome draws its own clock glyph inside <input type="time">, in a near-black
     grey that all but disappears on this background. Supplying a background
     image replaces that glyph, so the picker is visible and matches the theme. */
  input[type="time"]::-webkit-calendar-picker-indicator{
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ff5c72%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%3Cpolyline%20points%3D%2212%207%2012%2012%2015.5%2014%22%2F%3E%3C%2Fsvg%3E");
    background-size:15px 15px;background-repeat:no-repeat;background-position:center;
    width:16px;height:16px;opacity:1;cursor:pointer;padding:0;margin-left:4px;}
  input[type="time"]::-webkit-calendar-picker-indicator:hover{filter:brightness(1.25);}
  /* A dose that has not come round yet: shown, but not tickable. */
  .slot.pending{opacity:.6;cursor:default;}
  .slot.pending:hover{border-color:var(--glass-border-2);}
  /* A past slot that was never logged. */
  .slot.missed{border-color:rgba(255,92,114,0.35);color:var(--red,#ff5c72);}
  .slot.missed .tickbox{border-color:rgba(255,92,114,0.5);}

  .adh-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .adh-wrap .gauge{width:140px;height:140px;margin-bottom:8px;}
  .adh-sub{font-size:11.5px;color:var(--ink-500);line-height:1.6;}

  .heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:12px;}
  .heat i{aspect-ratio:1;border-radius:3px;background:var(--wash-2);}
  .heat i.l1{background:rgba(34,229,240,0.28);} .heat i.l2{background:rgba(34,229,240,0.55);}
  .heat i.l3{background:rgba(34,229,240,0.85);}

  .add-form{display:none;}
  .add-form.on{display:block;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px;font-weight:700;}
  .field input{width:100%;background:var(--wash-1);border:1px solid var(--glass-border);border-radius:11px;
    padding:11px 13px;font-size:12.5px;font-family:'Inter';color:var(--ink-0);outline:none;box-sizing:border-box;}
  .field input:focus{border-color:rgba(34,229,240,0.5);}
  .time-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .time-chip{display:flex;align-items:center;gap:6px;background:rgba(34,229,240,0.1);border:1px solid rgba(34,229,240,0.35);
    color:var(--cyan-bright);font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:9px;}
  .time-chip button{background:transparent;border:none;color:var(--cyan-bright);cursor:pointer;font-size:13px;padding:0;}
  .err-note{display:none;font-size:11.5px;color:#ffb3bd;background:rgba(255,92,114,0.1);
    border:1px solid rgba(255,92,114,0.35);padding:9px 12px;border-radius:10px;margin-bottom:12px;}
  .err-note.on{display:block;}
  .empty{text-align:center;padding:38px 20px;color:var(--ink-500);font-size:12.5px;line-height:1.7;}
  .empty .ic{font-size:32px;margin-bottom:9px;}

  /* Phone. Two columns become one, and the week strip keeps seven days by
     shrinking rather than overflowing. */
  @media(max-width:900px){
    .med-grid{grid-template-columns:1fr;gap:14px;}
    .cal-strip{gap:4px;}
    .cal-day{padding:11px 2px;min-height:52px;display:flex;flex-direction:column;justify-content:center;}
    .cal-nav{min-width:30px;padding:0 4px;}
    .cal-day .dw{font-size:8.5px;}
    .cal-day .dn{font-size:13px;}
    .heat{grid-template-columns:repeat(10,1fr);}
    .slots{flex-wrap:wrap;}
    .slot{min-height:38px;}          /* thumb-sized */
    .add-form input,.add-form select{font-size:16px;}
    .field input{font-size:16px;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="rail" data-active="medicines"></div>
  <div class="main">
    <div class="topbar">
      <div class="brand">Pulse<span>IQ</span></div>
      <div class="grow"></div>
      <span id="backendBadge" class="badge" style="margin-right:10px;">● Connecting…</span>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="content">
      <div class="page-head"><h1>Medicines</h1><span class="sub" id="pageSub">Your schedule and adherence</span></div>

      <div id="signinNote"></div>

      <div class="cal-bar">
        <button class="cal-nav" id="calPrev" title="Previous week">◀</button>
        <div class="cal-strip" id="calStrip"></div>
        <button class="cal-nav" id="calNext" title="Next week">▶</button>
      </div>

      <div class="med-grid">
        <div class="card">
          <div style="display:flex;align-items:center;">
            <div>
              <div class="day-title"><h3 style="margin:0;" id="dayHeading">Doses</h3><span class="badge-day" id="dayBadge" style="display:none;">Today</span></div>
              <div class="card-sub" style="margin:2px 0 0;" id="todayDate">—</div>
            </div>
            <button class="btn primary" id="btnAdd" style="margin-left:auto;">+ Add Medicine</button>
          </div>

          <div class="add-form" id="addForm" style="margin-top:16px;">
            <div class="err-note" id="addErr"></div>
            <div class="field"><label>Medicine name</label><input id="mName" placeholder="e.g. Amlodipine"></div>
            <div class="field"><label>Dosage</label><input id="mDose" placeholder="e.g. 5mg"></div>
            <div class="field">
              <label>Reminder times</label>
              <div class="time-row">
                <input type="time" id="mTime" style="width:150px;">
                <button class="btn" id="btnAddTime" style="background:var(--glass);border:1px solid var(--glass-border-2);color:var(--ink-200);">+ Add time</button>
              </div>
              <div class="time-row" id="timeChips" style="margin-top:9px;"></div>
            </div>
            <div class="field"><label>Notes (optional)</label><input id="mNotes" placeholder="e.g. after dinner"></div>
            <div style="display:flex;gap:9px;">
              <button class="btn primary" id="btnSave">Save Medicine</button>
              <button class="btn" id="btnCancel" style="background:var(--glass);border:1px solid var(--glass-border-2);color:var(--ink-300);">Cancel</button>
            </div>
          </div>

          <div id="medList" style="margin-top:16px;"></div>
        </div>

        <div>
          <div class="card">
            <h3>Adherence</h3>
            <div class="card-sub" id="adhWindow">Last 30 days</div>
            <div class="adh-wrap">
              <div class="gauge">
                <svg viewBox="0 0 120 120">
                  <circle class="track" cx="60" cy="60" r="50"/>
                  <circle class="fill cyan" id="adhArc" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"/>
                </svg>
                <div class="center"><div class="v" id="adhPct">—</div><div class="l">adherence</div></div>
              </div>
              <div class="adh-sub" id="adhDetail">No doses scheduled yet</div>
            </div>
          </div>

          <div class="card" style="margin-top:16px;">
            <h3>Last 30 Days</h3>
            <div class="card-sub">Doses logged per day</div>
            <div class="heat" id="heat"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <span>SYS: <b>OPERATIONAL</b></span>
      <span>PulseIQ · Explainable Cuffless BP Monitoring · Demo Mode</span>
    </div>
  </div>
</div>
<script src="shared/shell.js?v=18"></script>
<script>
  function tick(){ var d=new Date(); document.getElementById('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }
  setInterval(tick,1000); tick();

  var PULSEIQ_API = (window.PULSEIQ_API_BASE || (location.port === '8090' ? 'http://localhost:8001' : location.origin));
  var TOKEN = localStorage.getItem('pulseiq_token');
  var PENDING_TIMES = [];

  // ---- Calendar state ---------------------------------------------------
  function iso(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fromIso(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function startOfWeek(d){                    // weeks run Monday → Sunday
    var x = new Date(d), day = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x;
  }
  var TODAY_ISO = iso(new Date());
  var SELECTED = TODAY_ISO;
  var WEEK_START = startOfWeek(new Date());
  var HISTORY_BY_DAY = {};                     // day -> doses logged, for the pips

  function H(){ return TOKEN ? Object.assign({'Content-Type':'application/json'},{'Authorization':'Bearer '+TOKEN}) : {'Content-Type':'application/json'}; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function setBadge(ok,l){ var b=document.getElementById('backendBadge'); if(!b)return;
    if(ok){b.textContent='● '+(l||'Connected');b.style.color='var(--green)';b.style.borderColor='rgba(52,211,153,0.4)';}
    else {b.textContent='● '+(l||'Offline');b.style.color='var(--ink-500)';} }
  function showErr(m){ var e=document.getElementById('addErr'); e.textContent=m||''; e.className='err-note'+(m?' on':''); }
  function pretty(t){
    var p=t.split(':'), h=parseInt(p[0],10), ap=h>=12?'PM':'AM';
    var hh=h%12; if(hh===0) hh=12;
    return hh+':'+p[1]+' '+ap;
  }

  function renderTimeChips(){
    document.getElementById('timeChips').innerHTML = PENDING_TIMES.map(function(t,i){
      return '<span class="time-chip">'+t+'<button data-rm="'+i+'">×</button></span>';
    }).join('');
    document.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){
        PENDING_TIMES.splice(parseInt(this.getAttribute('data-rm'),10),1); renderTimeChips();
      });
    });
  }

  var DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function renderCalendar(){
    var strip = document.getElementById('calStrip');
    var html = '';
    for(var i=0;i<7;i++){
      var d = new Date(WEEK_START); d.setDate(d.getDate()+i);
      var key = iso(d);
      var future = key > TODAY_ISO;
      var cls = 'cal-day' + (key===SELECTED?' on':'') + (key===TODAY_ISO?' today':'') + (future?' future':'');
      var n = HISTORY_BY_DAY[key] || 0;
      var pips = '';
      if(!future && n > 0){
        pips = '<div class="pip">' + Array(Math.min(n,4)).fill('<i></i>').join('') + '</div>';
      }
      html += '<div class="'+cls+'" data-day="'+key+'">' +
              '<div class="dw">'+DAYS_SHORT[i]+'</div><div class="dn">'+d.getDate()+'</div>'+pips+'</div>';
    }
    strip.innerHTML = html;
    // Every day in the strip is selectable, including future ones — a future
    // day shows what is scheduled ahead, it just can't be logged.
    strip.querySelectorAll('.cal-day').forEach(function(el){
      el.addEventListener('click', function(){
        SELECTED = this.getAttribute('data-day');
        load();
      });
    });
    document.getElementById('calNext').disabled = false;
  }

  document.getElementById('calPrev').onclick = function(){
    WEEK_START.setDate(WEEK_START.getDate()-7); renderCalendar();
  };
  document.getElementById('calNext').onclick = function(){
    WEEK_START.setDate(WEEK_START.getDate()+7); renderCalendar();
  };

  function renderMeds(d){
    var el = document.getElementById('medList');
    var isToday  = d.selectedDay === d.today;
    var isFuture = d.selectedDay > d.today;
    var isPast   = d.selectedDay < d.today;
    var sd = fromIso(d.selectedDay);
    document.getElementById('dayHeading').textContent =
      isToday ? "Today's Doses" : (isFuture ? 'Scheduled Doses' : 'Doses');
    var badge = document.getElementById('dayBadge');
    badge.style.display = isToday ? 'inline-block' : 'none';
    document.getElementById('todayDate').textContent =
      sd.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long', year:'numeric'}) +
      (isToday  ? ' · tap a time to mark it taken'
       : isFuture ? ' · upcoming — not due yet'
       : ' · past day — tap a time to log it late');

    // A reminder can only be created for today onwards, so the add form is
    // hidden while looking backwards.
    var addBtn = document.getElementById('btnAdd');
    if(addBtn){
      addBtn.style.display = isPast ? 'none' : '';
      if(isPast){
        var form = document.getElementById('addForm');
        if(form) form.classList.remove('on');
      }
    }

    if(!d.medicines.length){
      el.innerHTML = '<div class="empty"><div class="ic">💊</div>No medicines added yet.<br>' +
                     'Add one to start tracking doses and adherence.</div>';
      return;
    }
    var scheduled = d.medicines.filter(function(m){ return m.scheduledOnDay; });
    if(!scheduled.length){
      // Honest reason rather than a dead end: these medicines were added after
      // this date, so there is genuinely no dose history to show for it.
      var added = d.medicines.map(function(m){ return m.createdAt; })
                             .filter(function(x){ return x != null; }).sort();
      var since = added.length ? new Date(added[0]*1000)
                    .toLocaleDateString([], {day:'numeric', month:'long', year:'numeric'}) : null;
      el.innerHTML = '<div class="empty"><div class="ic">📅</div>' +
                     'No doses were scheduled on this date.<br>' +
                     (since ? 'Your earliest reminder starts ' + esc(since) + '.'
                            : 'Your reminders start after this date.') + '</div>';
      return;
    }
    el.innerHTML = scheduled.map(function(m){
      var slots = m.times.map(function(t){
        var done = m.takenOnDay.indexOf(t) > -1;
        // Future doses are shown but not tickable; past ones that were never
        // logged are marked missed rather than left looking merely untouched.
        var cls = done ? ' done' : (isFuture ? ' pending' : (isPast ? ' missed' : ''));
        var mark = done ? '✓' : (isFuture ? '' : (isPast ? '✕' : ''));
        return '<div class="slot'+cls+'" data-med="'+m.id+'" data-slot="'+t+'" data-done="'+(done?1:0)+'">' +
               '<span class="tickbox">'+mark+'</span>'+pretty(t)+'</div>';
      }).join('');
      return '<div class="med-item">' +
        (isPast ? '' : '<button class="med-del" data-del="'+m.id+'" title="Remove">✕</button>') +
        '<div class="row1"><span class="nm">'+esc(m.name)+'</span><span class="ds">'+esc(m.dosage)+'</span></div>' +
        (m.notes ? '<div class="nt">'+esc(m.notes)+'</div>' : '') +
        '<div class="slots">'+slots+'</div></div>';
    }).join('');

    if(!isFuture){
      el.querySelectorAll('.slot').forEach(function(s){
        s.addEventListener('click', function(){
          toggleDose(this.getAttribute('data-med'), this.getAttribute('data-slot'), this.getAttribute('data-done') !== '1');
        });
      });
    }
    el.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ removeMed(this.getAttribute('data-del')); });
    });
  }

  function renderAdherence(d){
    var a = d.adherence;
    document.getElementById('adhWindow').textContent = 'Last ' + a.windowDays + ' days';
    if(a.percent === null){
      document.getElementById('adhPct').textContent = '—';
      document.getElementById('adhArc').setAttribute('stroke-dashoffset', 314);
      document.getElementById('adhDetail').textContent = 'No doses scheduled yet';
    } else {
      document.getElementById('adhPct').textContent = Math.round(a.percent) + '%';
      document.getElementById('adhArc').setAttribute('stroke-dashoffset', (314 * (1 - a.percent/100)).toFixed(1));
      document.getElementById('adhDetail').innerHTML =
        '<b style="color:var(--ink-0);">' + a.taken + '</b> of <b style="color:var(--ink-0);">' + a.expected + '</b> scheduled doses logged';
    }
    var max = Math.max.apply(null, d.history.map(function(h){ return h.taken; }).concat([1]));
    HISTORY_BY_DAY = {};
    d.history.forEach(function(h){ HISTORY_BY_DAY[h.day] = h.taken; });
    document.getElementById('heat').innerHTML = d.history.map(function(h){
      var lvl = h.taken === 0 ? '' : (h.taken/max > 0.66 ? 'l3' : (h.taken/max > 0.33 ? 'l2' : 'l1'));
      return '<i class="'+lvl+'" data-day="'+h.day+'" style="cursor:pointer;" title="'+h.day+': '+h.taken+' dose(s) — click to open"></i>';
    }).join('');
    // Clicking a heatmap cell jumps the calendar to that day.
    document.getElementById('heat').querySelectorAll('[data-day]').forEach(function(c){
      c.addEventListener('click', function(){
        SELECTED = this.getAttribute('data-day');
        WEEK_START = startOfWeek(fromIso(SELECTED));
        load();
      });
    });
    renderCalendar();
  }

  function load(){
    if(!TOKEN){
      setBadge(false,'Guest');
      document.getElementById('signinNote').innerHTML =
        '<div style="background:rgba(255,200,87,0.08);border:1px solid rgba(255,200,87,0.3);color:var(--amber);' +
        'font-size:11.5px;padding:11px 15px;border-radius:11px;margin-bottom:16px;line-height:1.6;">' +
        'You\'re browsing as a guest, so reminders can\'t be saved. ' +
        '<a href="login.html" style="color:var(--cyan-bright);font-weight:700;">Sign in or create an account</a> to track your medicines.</div>';
      document.getElementById('btnAdd').disabled = true;
      document.getElementById('medList').innerHTML =
        '<div class="empty"><div class="ic">🔒</div>Sign in to add medicines and track adherence.</div>';
      renderCalendar();
      return;
    }
    fetch(PULSEIQ_API + '/api/medicines?day=' + encodeURIComponent(SELECTED), {headers:H()})
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(d){
        setBadge(true,'Connected');
        document.getElementById('pageSub').textContent =
          d.medicines.length + ' active medicine' + (d.medicines.length===1?'':'s');
        renderMeds(d); renderAdherence(d);
      })
      .catch(function(){
        setBadge(false,'Offline');
        document.getElementById('medList').innerHTML =
          '<div class="empty"><div class="ic">⚠</div>Backend not reachable at ' + PULSEIQ_API +
          '<br>Start it with: python -m uvicorn main:app --port 8001</div>';
      });
  }

  function toggleDose(id, slot, taken){
    // Logs against the day currently selected in the calendar, not just today.
    fetch(PULSEIQ_API + '/api/medicines/' + id + '/dose', {
      method:'POST', headers:H(), body: JSON.stringify({slot:slot, taken:taken, day:SELECTED})
    }).then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(){ load(); })
      .catch(function(){ setBadge(false,'Offline'); });
  }

  function removeMed(id){
    if(!confirm('Remove this medicine and its dose history?')) return;
    fetch(PULSEIQ_API + '/api/medicines/' + id, {method:'DELETE', headers:H()})
      .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
      .then(function(){ load(); })
      .catch(function(){});
  }

  document.getElementById('btnAdd').onclick = function(){
    document.getElementById('addForm').classList.add('on'); showErr('');
  };
  document.getElementById('btnCancel').onclick = function(){
    document.getElementById('addForm').classList.remove('on');
    PENDING_TIMES = []; renderTimeChips(); showErr('');
    ['mName','mDose','mNotes'].forEach(function(id){ document.getElementById(id).value=''; });
  };
  document.getElementById('btnAddTime').onclick = function(){
    var t = document.getElementById('mTime').value;
    if(!t){ showErr('Pick a time first.'); return; }
    if(PENDING_TIMES.indexOf(t) > -1){ showErr('That time is already added.'); return; }
    PENDING_TIMES.push(t); PENDING_TIMES.sort(); renderTimeChips(); showErr('');
  };
  document.getElementById('btnSave').onclick = function(){
    showErr('');
    var name = document.getElementById('mName').value.trim();
    if(!name){ showErr('Enter a medicine name.'); return; }
    if(!PENDING_TIMES.length){ showErr('Add at least one reminder time.'); return; }
    fetch(PULSEIQ_API + '/api/medicines', {
      method:'POST', headers:H(),
      body: JSON.stringify({
        name: name,
        dosage: document.getElementById('mDose').value.trim(),
        times: PENDING_TIMES,
        notes: document.getElementById('mNotes').value.trim()
      })
    })
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok){ showErr(res.d.detail || 'Could not save.'); return; }
        document.getElementById('btnCancel').click();
        load();
      })
      .catch(function(){ showErr('Backend not reachable at ' + PULSEIQ_API); });
  };

  load();
</script>
</body>
</html>
